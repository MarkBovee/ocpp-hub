name: Charger report
description: Tell us how OCPP Hub works with a charger that is not on the list yet
labels: [charger]
body:
  - type: input
    id: charger
    attributes:
      label: Charger
      description: Manufacturer, model and firmware
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Connects and shows status and meter values
        - label: Charge limit
        - label: Start and stop
        - label: Vendor mirror (the vendor app shows the charger online)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything odd, with log lines (without serial numbers or addresses)
