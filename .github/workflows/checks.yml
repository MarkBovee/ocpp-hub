name: Checks

# Reusable: the one list of checks that both the branch/PR run and the release run use.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ruff==0.16.4 mypy==1.15.0 pytest pytest-asyncio pyyaml voluptuous websockets

      - name: Version check
        run: python tools/version.py check

      - name: Lint
        run: ruff check .

      - name: Validate YAML
        run: python -c "import pathlib, yaml; [yaml.safe_load(path.read_text()) for pattern in ('*.yml', '*.yaml') for path in pathlib.Path('.').rglob(pattern)]"

      - name: Format check
        run: ruff format --check custom_components

      - name: Type check
        run: mypy --strict --follow-imports=skip custom_components/ocpp_hub/core

      - name: Test
        run: pytest -q tests/ --junitxml=pytest-report.xml

      - name: Compile
        run: python3 -m compileall -f custom_components/ocpp_hub/

      - name: Diff check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            base=$(git rev-parse --verify -q HEAD^ || git hash-object -t tree /dev/null)
            git diff --check "$base" HEAD
          fi

  # The Home Assistant layer (config flow, setup, entities, diagnostics) against the real Home Assistant test harness.
  # The version of the plugin pins the Home Assistant version it tests against; keep it equal to the owner's server.
  ha-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component==0.13.373 "websockets>=15.0.1"

      - name: Test the Home Assistant layer
        run: pytest -q tests_ha/
