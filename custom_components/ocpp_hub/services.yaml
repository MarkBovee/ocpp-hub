get_sessions:
  fields:
    charger_id:
      required: false
      example: "CHARGER1"
      selector:
        text:
    limit:
      required: false
      example: 20
      selector:
        number:
          min: 1
          mode: box

set_schedule:
  fields:
    charger_id:
      required: false
      example: "CHARGER1"
      selector:
        text:
    periods:
      required: true
      example: '[{"time": "00:00", "limit": 6}, {"time": "07:00", "limit": 16}]'
      selector:
        object:

set_plan:
  fields:
    charger_id:
      required: false
      example: "CHARGER1"
      selector:
        text:
    windows:
      required: true
      example: '[{"day": "monday", "from": "12:00", "to": "14:00"}, {"day": "tuesday", "from": "13:00", "to": "17:00"}]'
      selector:
        object:
