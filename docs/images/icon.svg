<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- OCPP Hub icon: a charging connector with a bolt, on a teal tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- connector ring with three hub nodes -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="128" cy="50" r="13" fill="#FFFFFF"/>
  <circle cx="60.5" cy="167" r="13" fill="#FFFFFF"/>
  <circle cx="195.5" cy="167" r="13" fill="#FFFFFF"/>
  <!-- bolt -->
  <path d="M140 76 L96 136 H124 L114 182 L160 118 H131 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
</svg>
