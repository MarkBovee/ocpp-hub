[project]
name = "ocpp-hub"
version = "0.1.0"
description = "Home Assistant integration: a local OCPP 1.6 central system with an optional read-only mirror to the charger vendor's backend"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Mark Bovee" }]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".git", ".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"
exclude = [".git", ".venv", "venv"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
